name: Actualizar catálogo

on:
  schedule:
    - cron: '17 12 * * *'   # todos los días ~6:17 a. m. hora de Honduras
  workflow_dispatch:
    inputs:
      tiendas:
        description: 'Tiendas a actualizar separadas por espacio (vacío = todas; none = ninguna): diunsa curacao elektra ladylee walmart gallo radioshack tropigas acosa gamestation sycom'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['src/**', 'data/manual/**', 'site/*.html', 'package.json', '.github/workflows/actualizar.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar-catalogo
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # siempre la versión más reciente (otra corrida pudo publicar datos mientras esta esperaba)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Extraer productos de las tiendas
        # En un push solo se reconstruye con los datos guardados, salvo que el commit diga [scrape].
        env:
          # Gallo (Magento) envía encabezados muy largos; Node los rechaza con el límite por defecto (16 KB).
          NODE_OPTIONS: --max-http-header-size=131072
          EVENT: ${{ github.event_name }}
          MSG: ${{ github.event.head_commit.message }}
          TIENDAS: ${{ github.event.inputs.tiendas }}
        run: |
          if [ "$EVENT" = "push" ] && [[ "$MSG" != *"[scrape]"* ]]; then ARGS=none; else ARGS="$TIENDAS"; fi
          node src/scrape.mjs $ARGS
      - name: Miniaturas de los productos
        run: node src/thumbs.mjs
      - name: Guardar cambios
        run: |
          git config user.name "vitrina-bot"
          git config user.email "vitrina-bot@users.noreply.github.com"
          git add data site/catalog.json site/thumbs site/details
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Catálogo actualizado $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase -X theirs origin main   # si chocan archivos generados, gana el catálogo de esta corrida
          git push
      - name: Páginas para buscadores (categorías, productos, sitemap)
        env:
          SITE_URL: https://vitrinahn.shop
        run: node src/seo.mjs
      - name: Preparar la página
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
